<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Atendimento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand: #2563eb;
      --bg: #eef1f6;
      --panel: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --bubble: #f3f4f6;
      --shadow: 0 10px 40px rgba(15, 23, 42, .10);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0f17;
        --panel: #121826;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --border: #1f2937;
        --bubble: #1b2232;
        --shadow: 0 10px 40px rgba(0, 0, 0, .45);
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .app {
      width: 100%;
      max-width: 820px;
      height: min(100dvh, 900px);
      background: var(--panel);
      display: flex;
      flex-direction: column;
      border-radius: 20px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    @media (max-width: 860px) {
      body { align-items: stretch; }
      .app { height: 100dvh; border-radius: 0; max-width: none; }
    }

    /* Cabeçalho */
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      background: var(--brand);
      color: #fff;
    }
    .avatar {
      width: 42px; height: 42px; border-radius: 50%;
      background: rgba(255,255,255,.2);
      display: grid; place-items: center;
      font-weight: 700; font-size: 15px; flex-shrink: 0;
    }
    .avatar.small { width: 30px; height: 30px; font-size: 12px; background: var(--brand); color: #fff; }
    .title { flex: 1; min-width: 0; }
    .title h1 { font-size: 16px; margin: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .title p { margin: 2px 0 0; font-size: 12.5px; opacity: .9; display: flex; align-items: center; gap: 6px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 0 2px rgba(74,222,128,.3); }
    .icon-btn {
      background: rgba(255,255,255,.15); border: 0; color: #fff; border-radius: 10px;
      padding: 8px 12px; cursor: pointer; font: inherit; font-size: 13px;
      display: flex; align-items: center; gap: 6px;
    }
    .icon-btn:hover { background: rgba(255,255,255,.25); }
    .icon-btn svg { width: 16px; height: 16px; }
    @media (max-width: 480px) { .icon-btn span { display: none; } .icon-btn { padding: 9px; } }

    /* Mensagens */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 22px 18px 8px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }
    .row { display: flex; gap: 10px; align-items: flex-end; max-width: 100%; }
    .row.user { justify-content: flex-end; }
    .stack { display: flex; flex-direction: column; gap: 6px; max-width: min(78%, 600px); min-width: 0; }
    .row.user .stack { align-items: flex-end; }
    .bubble {
      padding: 11px 15px;
      border-radius: 18px;
      line-height: 1.5;
      font-size: 15px;
      overflow-wrap: anywhere;
    }
    .row.bot .bubble { background: var(--bubble); border-bottom-left-radius: 6px; }
    .row.user .bubble { background: var(--brand); color: #fff; border-bottom-right-radius: 6px; white-space: pre-wrap; }
    .bubble p { margin: 0 0 8px; }
    .bubble p:last-child, .bubble ul:last-child, .bubble ol:last-child { margin-bottom: 0; }
    .bubble ul, .bubble ol { margin: 4px 0 8px; padding-left: 20px; }
    .bubble li { margin: 2px 0; }
    .bubble h4 { margin: 6px 0 4px; font-size: 15px; }
    .bubble a { color: var(--brand); font-weight: 500; }
    .bubble code { background: rgba(127,127,127,.15); padding: 1px 5px; border-radius: 5px; font-size: 13.5px; }
    .bubble pre { background: rgba(127,127,127,.12); padding: 10px; border-radius: 10px; overflow-x: auto; }
    .bubble blockquote { margin: 6px 0; padding-left: 10px; border-left: 3px solid var(--border); color: var(--muted); }
    .bubble.error { background: #fee2e2; color: #991b1b; }
    @media (prefers-color-scheme: dark) { .bubble.error { background: #3b1219; color: #fecaca; } }

    .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
    .source {
      border: 1px solid var(--border); border-radius: 999px; padding: 2px 9px;
      display: inline-flex; align-items: center; gap: 4px; max-width: 220px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .actions { display: inline-flex; gap: 2px; margin-left: auto; }
    .actions button {
      border: 0; background: transparent; color: var(--muted); cursor: pointer;
      padding: 4px; border-radius: 6px; display: grid; place-items: center;
    }
    .actions button:hover { background: var(--bubble); color: var(--text); }
    .actions button.on { color: var(--brand); }
    .actions svg { width: 15px; height: 15px; }

    .typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
    .typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite ease-in-out; }
    .typing span:nth-child(2) { animation-delay: .15s; }
    .typing span:nth-child(3) { animation-delay: .3s; }
    @keyframes blink { 0%, 80%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }

    .suggestions { display: flex; flex-wrap: wrap; gap: 8px; padding-left: 40px; }
    .suggestions button {
      border: 1px solid var(--brand); color: var(--brand); background: transparent;
      border-radius: 999px; padding: 7px 13px; font: inherit; font-size: 13.5px; cursor: pointer;
      text-align: left;
    }
    .suggestions button:hover { background: var(--brand); color: #fff; }

    /* Entrada */
    footer { padding: 10px 16px 14px; border-top: 1px solid var(--border); }
    form {
      display: flex; align-items: flex-end; gap: 8px;
      background: var(--bubble); border-radius: 16px; padding: 6px 6px 6px 14px;
      border: 1px solid transparent;
    }
    form:focus-within { border-color: var(--brand); }
    textarea {
      flex: 1; border: 0; background: transparent; resize: none; outline: none;
      font: inherit; font-size: 15px; color: var(--text); line-height: 1.45;
      padding: 8px 0; max-height: 140px;
    }
    #send {
      width: 40px; height: 40px; border-radius: 12px; border: 0; cursor: pointer;
      background: var(--brand); color: #fff; display: grid; place-items: center; flex-shrink: 0;
    }
    #send:disabled { opacity: .45; cursor: default; }
    #send svg { width: 18px; height: 18px; }
    .note { text-align: center; font-size: 11.5px; color: var(--muted); margin-top: 8px; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="avatar" id="avatar">AV</div>
      <div class="title">
        <h1 id="assistantName">Assistente Virtual</h1>
        <p><span class="dot"></span><span id="companyName">Atendimento online</span></p>
      </div>
      <button class="icon-btn" id="newChat" title="Começar uma nova conversa">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        <span>Nova conversa</span>
      </button>
    </header>

    <main id="messages" aria-live="polite"></main>

    <footer>
      <form id="form">
        <textarea id="input" rows="1" placeholder="Digite sua mensagem…" aria-label="Mensagem" maxlength="4000"></textarea>
        <button id="send" type="submit" aria-label="Enviar" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </form>
      <div class="note">Atendimento automatizado com IA. Para casos específicos, peça para falar com um atendente.</div>
    </footer>
  </div>

  <script src="/markdown.js"></script>
  <script src="/chat.js"></script>
</body>
</html>
